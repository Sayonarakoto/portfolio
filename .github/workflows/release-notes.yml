name: Release notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build two-month release notes
        shell: bash
        run: |
          set -euo pipefail
          since="$(date -u -d '2 months ago' '+%Y-%m-%d')"
          tag="v$(date -u '+%Y.%m.%d')"

          {
            echo "## Changes since ${since}"
            echo
            git log --since="${since}" --pretty=format:'- `%h` %s' --no-merges
            echo
            echo
            echo "## Files changed"
            echo
            git log --since="${since}" --name-only --pretty=format: --no-merges \
              | sed '/^$/d' | sort -u | sed 's#^#- `#; s#$#`#'
          } > release-notes.md

          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Release $RELEASE_TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" \
              --title "Release $RELEASE_TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
